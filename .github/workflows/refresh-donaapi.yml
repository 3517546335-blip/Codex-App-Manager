name: Refresh DonaAPI branch

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: refresh-donaapi
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Generate and validate DonaAPI branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin donaapi:refs/remotes/origin/donaapi || true
          old_sha="$(git rev-parse --verify refs/remotes/origin/donaapi 2>/dev/null || true)"

          git checkout -B donaapi origin/main
          node scripts/apply-donaapi-variant.mjs
          npm ci
          npm run check
          npm run lint
          npm test
          npm run build

          git add README.md src/app/components.tsx src/app/views/CodexConfig.tsx src/app/views/Home.tsx src/app/views/WinHome.tsx src/services/managerApi.ts src-tauri/src/commands.rs
          git commit -m "chore(donaapi): refresh variant from main"

          if [ -n "$old_sha" ] && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$old_sha^{tree}")" ]; then
            echo "DonaAPI branch already matches main plus the variant transform."
            exit 0
          fi

          if [ -n "$old_sha" ]; then
            git push --force-with-lease="refs/heads/donaapi:$old_sha" origin HEAD:donaapi
          else
            git push origin HEAD:donaapi
          fi
